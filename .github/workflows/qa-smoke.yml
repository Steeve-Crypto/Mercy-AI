name: Mercy QA Smoke

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qa-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      MERCY_ENV: local
      MERCY_AUTH_MODE: dev
      MERCY_API_TOKEN: playwright-local-token
      MERCY_CORE_API_TOKEN: playwright-local-token
      MERCY_TENANT_ID: playwright-tenant
      MERCY_USER_ID: playwright-user
      MERCY_ROLES: attorney
      MERCY_CORE_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_MERCY_CORE_API_URL: http://127.0.0.1:8000
      NEXT_PUBLIC_MERCY_API_TOKEN: playwright-local-token
      NEXT_PUBLIC_MERCY_TENANT_ID: playwright-tenant
      NEXT_PUBLIC_MERCY_USER_ID: playwright-user
      PLAYWRIGHT_WORKERS: "2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mercy-legal-web/package-lock.json
            mercy-legal-plugin/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install web dependencies
        working-directory: mercy-legal-web
        run: npm ci

      - name: Install add-in dependencies
        working-directory: mercy-legal-plugin
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: mercy-legal-web
        run: npx playwright install --with-deps chromium

      - name: Typecheck web
        working-directory: mercy-legal-web
        run: npm run typecheck

      - name: Compile full smoke script
        run: python -m py_compile scripts/full-smoke-test.py

      - name: Start backend
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Run Playwright Chromium E2E
        working-directory: mercy-legal-web
        run: npm run test:e2e:ci

      - name: Run Office manifest smoke
        working-directory: mercy-legal-plugin
        run: npm run smoke:office

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: mercy-legal-web/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: mercy-legal-web/test-results
          if-no-files-found: ignore

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log
          if-no-files-found: ignore
