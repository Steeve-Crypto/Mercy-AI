[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-discovery-ai"
version = "0.1.0"
description = "Optional legal discovery bridge helpers for Mercy Legal AI."
requires-python = ">=3.10,<3.14"
dependencies = [
  "python-dotenv",
  "streamlit",
  "reportlab",
  "python-docx",
]

[project.optional-dependencies]
crewai = [
  "crewai[tools,google-genai]",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
